name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Accept Android SDK Licenses and install platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web and Mobile Assets
        run: npm run build

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Show Gradle Error on Failure
        if: failure()
        run: |
          tail -n 100 android/gradle-build.log || true

      - name: Prepare APK
        run: |
          mkdir -p build-output
          APK_FOUND=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at $APK_FOUND"
          cp "$APK_FOUND" build-output/SmartTransitWallet.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTransitWallet-APK
          path: build-output/SmartTransitWallet.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Smart Transit Wallet v1.0.0
          body: |
            ### 📱 Smart Transit Wallet APK
            Descarga el archivo **SmartTransitWallet.apk** adjunto e instálalo en tu dispositivo Android.
          files: build-output/SmartTransitWallet.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
