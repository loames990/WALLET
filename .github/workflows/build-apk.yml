name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web and Mobile Assets
        run: npm run build

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK for Release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SmartTransitWallet.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTransitWallet-APK
          path: SmartTransitWallet.apk
          if-no-files-found: error

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Smart Transit Wallet v1.0.0 (APK)
          body: |
            ## 📱 Smart Transit Wallet APK
            Descarga `SmartTransitWallet.apk` e instálalo en tu dispositivo Android.
          files: SmartTransitWallet.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
